version: "1.0"
testform:
  required_version: ">= 1.0.0"
  backend: local

provider: 
  github:
    owner: "fromeroc9"
    repository: "testform-demo"
    project_id: "1"

resource:
  global:
    scaffold:
      attach: "attachments"
    fields:
      priority:
        source: "tag"
        required: false
        enum:
          - "@low"
          - "@medium"
          - "@high"
        default: "@medium"
      Status:
        source: "step"
        required: false
        default: "Done"
      assignees:  
        source: "step"
        required: false
        default: "fromeroc9"
      project:
        source: "step"
        required: true

  testcase:
    match: "*.case.feature"
    scaffold:
      directory: "testcase"
      filename: "{slug}_{YYYYMMDD}.case.feature"
    fields:
      - name: type_of_test
        source: "step"
        required: false
        default: "funcional"
      - name: automate
        source: "tag"
        default: "not apply"
      - name: module
        source: "step"
        required: true

  testrun:
    match: "*.run.feature"
    scaffold:
      directory: "testruns"
      filename: "{slug}_{YYYYMMDD}.run.feature"
    fields:
      - name: component
        source: "step"
        required: false
      - name: sprint
        source: "step"
        required: false
        default: "Sprint 3"
      - name: startDate
        source: "step"
        required: false
      - name: endDate
        source: "step"
        required: false
      - name: quarter
        source: "step"
        required: false
        default: "Q2"

  testplan:
    match: "*.plan.feature"
    scaffold:
      directory: "testplans"
      filename: "{slug}_{YYYYMMDD}.plan.feature"
    fields:
      - name: component
        source: "step"
        required: false
        default: "core"
      - name: squad
        source: "step"
        required: false
        default: "QA-Team"

  bug:
    match: "*.bug.feature"
    scaffold:
      directory: "bugs"
      filename: "{slug}_{YYYYMMDD}.bug.feature"
      attach: "attachments/bugs"
    fields:
      - name: severity
        source: "step"
        required: false
        enum:
          - "@blocker"
          - "@critical"
          - "@major"
          - "@minor"
        default: "@major"
      - name: bug_type
        source: "step"
        required: false
        default: "functional"
