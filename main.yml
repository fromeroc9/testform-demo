version: "1.0"
testform:
  required_version: ">= 1.0.0"
  backend: 
      github:
        repository: "fromeroc9/testform-state"
        branch: "main"
        path: "testform-demo.state"

provider: 
  github:
    owner: "fromeroc9"
    repository: "testform-demo"
    project_id: "1"

resource:
  global:
    fields:
      Status:
        source: "step"
        required: false
        default: "Done"
      priority:
        source: "tag"
        required: false
        enum:
          - "@low"
          - "@medium"
          - "@high"
        default: "@medium"
      assignees:  
        source: "step"
        required: false
        default: "fromeroc9"
      project:
        source: "step"
        required: true

  testcase:   
    match: "*.case.feature" 
    directory: "testcase"
    filename: "{slug}_{YYYYMMDD}.case.feature"
    fields:
      type_of_test:
        source: "step"
        required: false
        default: "funcional"
      automate:
        source: "tag"
        default: "not apply"
      module:
        source: "step"
        required: true

  testrun:
    match: "*.run.feature"
    directory: "testruns"
    filename: "{slug}_{YYYYMMDD}.run.feature"
    fields:
      - name: component
        source: "step"
        required: false
      - name: sprint
        source: "step"
        required: false
        default: "Sprint 3"
      - name: startDate
        source: "step"
        required: false
      - name: endDate
        source: "step"
        required: false
      - name: quarter
        source: "step"
        required: false
        default: "Q2"

  testplan:
    match: "*.plan.feature"
    directory: "testplans"
    filename: "{slug}_{YYYYMMDD}.plan.feature"
    fields:
      - name: component
        source: "step"
        required: false
        default: "core"
      - name: squad
        source: "step"
        required: false
        default: "QA-Team"

  bug:
    match: "*.bug.feature"
    directory: "bugs"
    filename: "{slug}_{YYYYMMDD}.bug.feature"
    attach: "attachments"
